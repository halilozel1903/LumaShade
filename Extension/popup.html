<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" width="44" height="44" alt="">
    <div><strong>LumaShade</strong><small>Comfortable dark mode</small></div>
  </header>
  <main>
    <label class="row"><span><b>Dark mode</b><small>For all websites</small></span><input id="enabled" type="checkbox" role="switch"></label>
    <label class="row"><span><b>Use on this site</b><small id="hostname">Finding website…</small></span><input id="site" type="checkbox" role="switch"></label>
    <p id="status" aria-live="polite">Getting ready…</p>
  </main>
  <footer>Photos and videos keep their original colors.</footer>
</body>
</html>
