<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LumaShade contrast regression</title>
<link rel="stylesheet" href="../Extension/content.css">
<style>
body{margin:0;background:#fff;color:#242424;font:18px -apple-system,BlinkMacSystemFont,sans-serif}
header{height:72px;display:flex;align-items:center;gap:28px;padding:0 28px;border-bottom:1px solid #ddd}
svg{flex:none}input{border:0;border-radius:24px;background:#f4f4f4;color:#242424;padding:14px 20px;font-size:17px;width:260px}input::placeholder{color:#777}
main{padding:38px 28px}.card{padding:28px;border:1px solid #dedede;background:#f4f4f4;max-width:520px;border-radius:12px}
img{display:block;width:100px;height:70px;object-fit:cover}
</style></head><body>
<header>
  <svg id="wordmark" width="178" height="46" viewBox="0 0 178 46" aria-label="Sample wordmark"><path d="M8 7h12l13 27L46 7h12v32H48V22L38 40H28L18 22v17H8zM69 7h10v32H69zM88 7h11q23 0 23 16t-23 16H88zm11 9v14h2q11 0 11-7t-11-7zM130 7h10v32h-10zM149 7h22v9h-12v4h11v8h-11v11h-10z" fill="#242424"/></svg>
  <input id="search" type="search" placeholder="Search">
  <svg id="multicolor" width="48" height="48" viewBox="0 0 48 48" aria-label="Colorful illustration"><circle cx="24" cy="24" r="20" fill="#257de1"/><circle cx="24" cy="24" r="9" fill="#ffbf52"/></svg>
</header>
<main><h1>Readable content</h1><p>The wordmark and search field should remain legible without changing their size.</p><div class="card">A light card becomes a readable dark card.</div></main>
<script>window.browser={storage:{local:{get:async()=>({enabled:true,sites:{}})},onChanged:{addListener(){}}},runtime:{onMessage:{addListener(){}}}};window.baseline=['#wordmark','#search','.card'].map(selector=>{const {x,y,width,height}=document.querySelector(selector).getBoundingClientRect();return {x,y,width,height}});</script>
<script src="../Extension/colors.js"></script><script src="../Extension/content.js"></script>
<script>setTimeout(()=>{const logo=document.querySelector('#wordmark path'),color=document.querySelector('#multicolor circle');const result=document.createElement('output');result.id='result';result.dataset.logo=getComputedStyle(logo).fill;result.dataset.placeholder=getComputedStyle(document.querySelector('#search'),'::placeholder').color;result.dataset.color=getComputedStyle(color).fill;result.dataset.layoutStable=['#wordmark','#search','.card'].every((selector,i)=>{const current=document.querySelector(selector).getBoundingClientRect();return Object.entries(window.baseline[i]).every(([key,value])=>Math.abs(current[key]-value)<.5)});document.body.append(result)},250);</script>
</body></html>
