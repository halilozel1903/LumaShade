<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="112" height="112" alt="LumaShade icon">
    <h1>LumaShade</h1>
    <p class="subtitle">A calmer web after dark.</p>
    <p class="state-unknown">Enable LumaShade in Safari Settings → Extensions.</p>
    <p class="state-on">The extension is on. Manage websites from its Safari toolbar icon.</p>
    <p class="state-off">Enable LumaShade in Safari Settings → Extensions.</p>
    <button class="open-preferences">Open Safari Extension Settings</button>
    <small>Darkens bright pages while preserving the colors of photos and videos.</small>
</body>
</html>
